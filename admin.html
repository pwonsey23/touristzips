<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TouristZips Admin</title><style>body{background:#07131e;color:#e8f8ff;font:15px system-ui;margin:auto;max-width:960px;padding:24px}h1,h2{color:#43d9ff}a{color:#43d9ff}section,article{padding:18px;background:#122a3a;border:1px solid #245875;border-radius:12px;margin:12px 0}input{padding:12px;width:min(95%,380px)}button{padding:11px 16px;background:#43d9ff;color:#06121b;border:0;border-radius:6px;cursor:pointer;margin:4px}.item{padding:12px 0;border-top:1px solid #356477}small{color:#a8c2d0}p{overflow-wrap:anywhere}</style></head><body><a href="/">← TouristZips</a><h1>TouristZips Control Room</h1><p>Private admin review for ballup@shoot4shot.com</p><section id="loginarea"><h2>Sign in by email</h2><form id="login"><input type="email" name="email" placeholder="Administrator email" required><button>Send Sign-in Link</button></form><p id="status"></p></section><section id="dashboard" hidden><button id="refresh">Refresh</button><button id="logout">Sign out</button><h2>ZIP File Submissions</h2><div id="submissions"></div><h2>Lease Inquiries</h2><div id="leases"></div></section><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://euakkcleljnpoxgeodhh.supabase.co','sb_publishable_D_BQtzGSLGF3gJKj-xnLzA_OfZCknUC');
const el=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function check(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:admin,error}=await db.rpc('is_touristzips_admin');if(error||!admin){el('status').textContent='This email is not authorized.';await db.auth.signOut();return;}el('loginarea').hidden=true;el('dashboard').hidden=false;await load()}
async function load(){el('submissions').textContent='Loading...';const [s,l]=await Promise.all([db.from('zip_submissions').select('*').order('created_at',{ascending:false}).limit(100),db.from('lease_inquiries').select('*').order('created_at',{ascending:false}).limit(100)]);if(s.error||l.error){el('submissions').textContent='Error: '+(s.error?.message||l.error?.message);return}el('submissions').innerHTML=s.data.length?s.data.map(x=>'<article class="item"><strong>'+safe(x.title)+'</strong> — '+safe(x.zip_code)+' — '+safe(x.status)+'<p>'+safe(x.description)+'</p><small>'+safe(x.name)+' · '+safe(x.email)+'</small><div><button data-review="approve" data-id="'+safe(x.id)+'">Approve</button><button data-review="reject" data-id="'+safe(x.id)+'">Reject</button></div></article>').join(''):'No submissions yet.';el('leases').innerHTML=l.data.length?l.data.map(x=>'<article class="item"><strong>'+safe(x.zip_code)+'</strong> — '+safe(x.status)+'<p>'+safe(x.intended_use)+'</p><small>'+safe(x.name)+' · '+safe(x.email)+' · '+safe(x.business)+'</small><div><button data-lease="'+safe(x.id)+'" data-status="contacted">Mark Contacted</button><button data-lease="'+safe(x.id)+'" data-status="closed">Close</button></div></article>').join(''):'No lease inquiries yet.'}
el('login').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.target).get('email').toString().trim().toLowerCase();if(email!=='ballup@shoot4shot.com'){el('status').textContent='Use the authorized administrator email.';return}const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/admin.html'}});el('status').textContent=error?error.message:'Check your email for the secure sign-in link.'};
el('refresh').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();location.reload()};el('submissions').onclick=async e=>{let b=e.target.closest('[data-review]');if(!b)return;if(!confirm('Confirm '+b.dataset.review+'?'))return;b.disabled=true;const {error}=await db.rpc('tz_review_submission',{p_id:b.dataset.id,p_action:b.dataset.review});if(error)alert(error.message);await load()};el('leases').onclick=async e=>{let b=e.target.closest('[data-lease]');if(!b)return;b.disabled=true;const {error}=await db.from('lease_inquiries').update({status:b.dataset.status}).eq('id',b.dataset.lease);if(error)alert(error.message);await load()};check();
</script></body></html>
